# CANNBot 模型切换代理 · 配置文件（示例）
# 复制本文件为 config.yaml，并填入你自己的鉴权信息。
# 监听地址 / api-key / 各 provider 鉴权都可以在控制台「设置」里改。
# 注意：config.yaml 含明文密钥，已被 .gitignore 排除，请勿提交真实文件。

server:
  host: 127.0.0.1
  port: 8787
  apiKey: ""
  selectedModel: cannbot/deepseek-v4-pro
providers:
  cannbot:
    displayName: CANNBot
    baseURL: https://cannbot.hicann.cn/anthropic
    headers:
      Authorization: Bearer <你的 JWT，每 24 小时过期>
      x-api-vkey: <你的虚拟密钥>
    models:
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        contextWindow: 1048576
      - id: deepseek-v4.1-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1048576
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        contextWindow: 1048576
      - id: qwen3.8-max
        name: Qwen3.8-Max
        contextWindow: 1048576
      - id: qwen3.8-flash
        name: Qwen3.8-Flash
        contextWindow: 1048576
      - id: glm-5.3
        name: GLM-5.3
        contextWindow: 1048576
      - id: glm-5.3-flash
        name: GLM-5.3-Flash
        contextWindow: 1048576
  cannbot-builtin:
    displayName: CANNBot 内置
    baseURL: https://cannbot.hicann.cn/anthropic
    headers:
      Authorization: Bearer <你的 JWT，每 24 小时过期>
      x-api-vkey: <你的虚拟密钥>
    models:
      - id: qwen3.8-flash
        name: Qwen3.8-Flash(built-in)
        contextWindow: 1048576
      - id: glm-5.3-flash
        name: GLM-5.3-Flash(built-in)
        contextWindow: 1048576
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash(built-in)
        contextWindow: 1048576
